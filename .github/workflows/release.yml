name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag: only build its pacman package and attach it to that release"
        required: false

permissions:
  contents: write

jobs:
  linux-static:
    if: ${{ !inputs.tag }}
    # oldest supported LTS runner = broadest glibc compatibility
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxrender-dev \
            libgl-dev libegl-dev libdrm-dev \
            libgbm-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libdbus-1-dev libudev-dev libusb-1.0-0-dev

      - name: Build static SDL3
        run: |
          git clone --depth 1 --branch release-3.4.14 \
            https://github.com/libsdl-org/SDL sdl3-src
          cmake -S sdl3-src -B sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/staticlibs"
          cmake --build sdl3-build -j"$(nproc)"
          cmake --install sdl3-build

      - name: Build static libcurl (HTTP + FTP, for --store uploads)
        run: |
          curl -sLO https://curl.se/download/curl-8.11.1.tar.gz
          tar xzf curl-8.11.1.tar.gz
          cd curl-8.11.1
          ./configure --disable-shared --enable-static --without-ssl \
            --without-libpsl --without-zlib --without-brotli --without-zstd \
            --without-nghttp2 --without-libidn2 --disable-ldap --disable-ldaps \
            --disable-rtsp --disable-dict --disable-telnet --disable-tftp \
            --disable-pop3 --disable-imap --disable-smb --disable-smtp \
            --disable-gopher --disable-mqtt --disable-file \
            --disable-docs --disable-manual --prefix="$GITHUB_WORKSPACE/staticlibs"
          make -j"$(nproc)"
          make install

      - name: Build c64uv (static SDL3/curl)
        run: |
          PKG_CONFIG_PATH="$PWD/staticlibs/lib/pkgconfig:$PWD/staticlibs/lib64/pkgconfig" \
            make STATIC=1
          ldd c64uv
          ./c64uv 2>&1 | head -2 || true

      - name: Smoke test (mock stream, headless)
        run: |
          python3 tools/mockstream.py 127.0.0.1 11000 8 >/dev/null &
          sleep 0.5
          timeout 10 ./c64uv --no-start --dump /tmp/frame.ppm
          head -c 20 /tmp/frame.ppm | grep -q "P6" && echo "frame OK"

      - name: Package
        run: |
          mkdir -p dist
          cp c64uv dist/
          strip dist/c64uv
          tar -C dist -czf "c64uv-${GITHUB_REF_NAME//\//-}-linux-x86_64.tar.gz" c64uv

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" \
            "c64uv-$GITHUB_REF_NAME-linux-x86_64.tar.gz" --clobber

      - name: Upload artifact (non-tag runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: c64uv-linux-x86_64
          path: c64uv-*-linux-x86_64.tar.gz

  # Cross-built with MinGW on Linux: the same static libcurl recipe as
  # above, SDL3 from its official MinGW development package (shipped as a
  # DLL next to the exe). Unverified on real hardware until a Windows
  # tester reports back; see CLAUDE.md roadmap 1.
  windows:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    env:
      SDL_VER: 3.2.20
      CURL_VER: 8.11.1
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 zip

      - name: Fetch SDL3 MinGW development package
        run: |
          curl -sLO "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VER/SDL3-devel-$SDL_VER-mingw.tar.gz"
          tar xzf "SDL3-devel-$SDL_VER-mingw.tar.gz"

      - name: Build static libcurl (HTTP + FTP)
        run: |
          curl -sLO "https://github.com/curl/curl/releases/download/curl-${CURL_VER//./_}/curl-$CURL_VER.tar.gz"
          tar xzf "curl-$CURL_VER.tar.gz"
          cd "curl-$CURL_VER"
          ./configure --host=x86_64-w64-mingw32 --disable-shared --enable-static \
            --without-ssl --without-libpsl --without-zlib --without-brotli \
            --without-zstd --without-nghttp2 --without-libidn2 --disable-ldap \
            --disable-ldaps --disable-rtsp --disable-dict --disable-telnet \
            --disable-tftp --disable-pop3 --disable-imap --disable-smb \
            --disable-smtp --disable-gopher --disable-mqtt --disable-file \
            --disable-docs --disable-manual --prefix="$GITHUB_WORKSPACE/wincurl"
          make -j"$(nproc)"
          make install

      - name: Build c64uv.exe
        run: |
          PKG_CONFIG_PATH="$PWD/SDL3-$SDL_VER/x86_64-w64-mingw32/lib/pkgconfig:$PWD/wincurl/lib/pkgconfig" \
            make TARGET=win32
          x86_64-w64-mingw32-strip c64uv.exe

      - name: Package
        run: |
          mkdir -p dist
          cp c64uv.exe "SDL3-$SDL_VER/x86_64-w64-mingw32/bin/SDL3.dll" README.md LICENSE dist/
          (cd dist && zip -q "../c64uv-${GITHUB_REF_NAME//\//-}-windows-x86_64.zip" ./*)

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" \
            "c64uv-$GITHUB_REF_NAME-windows-x86_64.zip" --clobber

      - name: Upload artifact (non-tag runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: c64uv-windows-x86_64
          path: c64uv-*-windows-x86_64.zip

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm base-devel github-cli sdl3 curl iputils hicolor-icon-theme

      - uses: actions/checkout@v4

      # Build the tag itself: the in-tree PKGBUILD still points at the
      # previous release until it is bumped afterwards.
      - name: Point PKGBUILD at the tag
        if: env.TAG != ''
        working-directory: packaging/aur
        run: |
          sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('SKIP')/" PKGBUILD

      - name: Build package
        working-directory: packaging/aur
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c "makepkg --noconfirm"

      - name: Upload to release
        if: env.TAG != ''
        working-directory: packaging/aur
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --generate-notes || true
          gh release upload "$TAG" c64uv-*.pkg.tar.zst --clobber

      - name: Upload artifact (non-tag runs)
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: c64uv-arch-package
          path: packaging/aur/c64uv-*.pkg.tar.zst
